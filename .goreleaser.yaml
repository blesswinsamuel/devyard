version: 2

project_name: devyard

before:
  hooks:
    - sh -c "cd web && bun install --frozen-lockfile && bun run build"

builds:
  - id: devyard-darwin
    main: ./cmd/devyard
    binary: devyard
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/blesswinsamuel/devyard/internal/cli.Version={{.Version}}

  - id: devyard-linux
    main: ./cmd/devyard
    binary: devyard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/blesswinsamuel/devyard/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: devyard
    repository:
      owner: blesswinsamuel
      name: homebrew-tap
      branch: main
      git:
        url: "git@github.com:blesswinsamuel/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    homepage: "https://github.com/blesswinsamuel/devyard"
    description: "Orchestrate local processes with a compose-style config (no Docker)"
    license: "MIT"
    skip_upload: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
