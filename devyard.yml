# Local development for the web UI: Go proxy + Vite (SolidJS) frontend.
#
# Prerequisites:
#   - Go toolchain
#   - gow (for live reload on file changes)
#   - bun (see web/bun.lock)
#   - A running devyard daemon (started automatically by `up`)
#
# Usage (from repo root):
#
#   devyard up          # foreground; Ctrl-C stops both
#   devyard up -d       # detached
#   devyard logs -f
#   devyard down
#
# Then open the Vite app at http://127.0.0.1:5173 (proxies /ws to the Go
# server on :9090). The `web` service below is `devyard web` — if you
# already have another instance on :9090, stop it or pass --port.

version: "1"
name: devyard

services:
  web:
    command: task web
    working_dir: .
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9090/ >/dev/null"]
      interval: 1s
      timeout: 2s
      retries: 60
    restart: always

  frontend:
    command: bun run dev
    working_dir: ./web
    depends_on:
      web: { condition: service_healthy }
    build: bun install
    restart: always

tasks:
  install-daemon: go install ./cmd/devyard
  restart-daemon: bash -c 'devyard daemon restart >/dev/null 2>&1 &'
