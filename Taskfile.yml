# https://taskfile.dev
#
# Same workflow as the root local-compose.yml (preferred):
#   local-compose up

version: "3"

tasks:
  default:
    desc: Run Go web proxy and Vite frontend for local development
    deps:
      - web
      - frontend

  web:
    desc: Start the local-compose web UI proxy (needs a running daemon)
    cmds:
      - gow run ./cmd/local-compose web

  frontend:
    desc: Start the Vite frontend (bun)
    dir: web
    cmds:
      - bun run dev
