syntax = "proto3";

package devyard.v1;

option go_package = "github.com/blesswinsamuel/devyard/internal/gen/proto/devyard/v1;devyardv1";

// DaemonService is the single control API of the devyard daemon. The CLI
// reaches it over the daemon's Unix socket (HTTP/2); the web UI reaches it
// over HTTP on the dashboard listener.
//
// State is observed through Watch (snapshot + revisioned deltas). Mutating
// RPCs return once the command has been accepted by the owning actor; the
// resulting state transitions arrive through Watch.
service DaemonService {
  // Daemon
  rpc GetDaemon(GetDaemonRequest) returns (GetDaemonResponse);
  rpc StopDaemon(StopDaemonRequest) returns (StopDaemonResponse);
  rpc RestartDaemon(RestartDaemonRequest) returns (RestartDaemonResponse);
  rpc GetGlobalConfig(GetGlobalConfigRequest) returns (GetGlobalConfigResponse);
  rpc UpdateGlobalConfig(UpdateGlobalConfigRequest) returns (UpdateGlobalConfigResponse);
  rpc SetWebPassword(SetWebPasswordRequest) returns (SetWebPasswordResponse);

  // State observation
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  rpc GetState(GetStateRequest) returns (GetStateResponse);

  // Projects
  rpc AddProject(AddProjectRequest) returns (AddProjectResponse);
  rpc StartProject(StartProjectRequest) returns (StartProjectResponse);
  rpc StopProject(StopProjectRequest) returns (StopProjectResponse);
  rpc RestartProject(RestartProjectRequest) returns (RestartProjectResponse);
  rpc ReloadProject(ReloadProjectRequest) returns (ReloadProjectResponse);
  rpc RemoveProject(RemoveProjectRequest) returns (RemoveProjectResponse);
  rpc MoveProject(MoveProjectRequest) returns (MoveProjectResponse);
  rpc SuggestProjectPaths(SuggestProjectPathsRequest) returns (SuggestProjectPathsResponse);

  // Services
  rpc StartService(StartServiceRequest) returns (StartServiceResponse);
  rpc StopService(StopServiceRequest) returns (StopServiceResponse);
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse);
  rpc KillService(KillServiceRequest) returns (KillServiceResponse);

  // Tasks
  rpc RunTask(RunTaskRequest) returns (RunTaskResponse);
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  rpc KillTask(KillTaskRequest) returns (KillTaskResponse);

  // Output, sessions, metrics
  rpc Logs(LogsRequest) returns (stream LogsResponse);
  rpc Attach(stream AttachRequest) returns (stream AttachResponse);
  rpc Stats(StatsRequest) returns (stream StatsResponse);
  rpc ListPorts(ListPortsRequest) returns (ListPortsResponse);

  // Git
  rpc GitLog(GitLogRequest) returns (GitLogResponse);
  rpc GitDiff(GitDiffRequest) returns (GitDiffResponse);
  rpc GitStage(GitStageRequest) returns (GitStageResponse);
  rpc GitStash(GitStashRequest) returns (GitStashResponse);
  rpc GitCommit(GitCommitRequest) returns (GitCommitResponse);
  rpc GitPush(GitPushRequest) returns (GitPushResponse);
  rpc GitPull(GitPullRequest) returns (GitPullResponse);
  rpc GitFetch(GitFetchRequest) returns (GitFetchResponse);
  rpc GitCheckout(GitCheckoutRequest) returns (GitCheckoutResponse);
  rpc GitBranchCreate(GitBranchCreateRequest) returns (GitBranchCreateResponse);
  rpc GitBranchDelete(GitBranchDeleteRequest) returns (GitBranchDeleteResponse);
  rpc GitTagCreate(GitTagCreateRequest) returns (GitTagCreateResponse);
  rpc GitTagDelete(GitTagDeleteRequest) returns (GitTagDeleteResponse);
  rpc GitRestore(GitRestoreRequest) returns (GitRestoreResponse);
  rpc GitApply(GitApplyRequest) returns (GitApplyResponse);
}

// -----------------------------------------------------------------------------
// Entities
// -----------------------------------------------------------------------------

message DaemonInfo {
  int32 pid = 1;
  int64 started_at_unix_ms = 2;
  string version = 3;
  string go_version = 4;
  int32 goroutines = 5;
  uint64 memory_rss = 6;
  uint64 memory_heap = 7;
  // Bound addresses (host:port). Empty when the listener is disabled.
  string web_addr = 8;
  string proxy_addr = 9;
  string proxy_tls_addr = 10;
  string domain_suffix = 11;
  bool draining = 12;
  // config_error describes a problem with the global config that the daemon
  // could not apply (a parse error, a listener that failed to bind, a
  // project that failed to load). The last good config stays in effect.
  // Empty when the config is applied.
  string config_error = 13;
}

message Project {
  // id is the project's stable identity: a validated slug derived from the
  // config's `name` (or its directory name).
  string id = 1;
  string config_path = 2;
  // env_files lists the project env files that exist, in load order.
  repeated string env_files = 3;
  // status: "stopped" | "starting" | "running" | "degraded" | "stopping" | "error"
  string status = 4;
  // desired: "running" | "stopped" | "partial" (a selected subset of services)
  string desired = 5;
  // error is set when the project cannot be loaded (config missing or
  // invalid). The project stays registered; fix the config and reload.
  string error = 6;
  int32 services_total = 7;
  int32 services_running = 8;
  // primary is the service served at the project's own hostname.
  string primary = 9;
  int64 updated_at_unix_ms = 10;
  repeated Link links = 11;
  // has_config is false for a project without a devyard.yml (git view and
  // terminals only).
  bool has_config = 12;
  // position is the project's index in the global config's project list;
  // clients show projects in this order.
  int32 position = 13;
  // drift describes how the config files on disk differ from what the
  // project runs; empty state when they are the same.
  ConfigDrift drift = 14;
  // reload_policy is what happens when the config files change: "prompt"
  // (show the change, apply it on ReloadProject), "auto" or "off".
  string reload_policy = 15;
}

// ConfigChange is one difference between a project's running config and its
// files.
message ConfigChange {
  // kind: "project" | "service" | "task"
  string kind = 1;
  string name = 2;
  // op: "added" | "removed" | "changed"
  string op = 3;
  // details say what changed, e.g. "run changed" or "env DATABASE_URL
  // changed". Environment values are never included.
  repeated string details = 4;
  // restart is true when applying the change restarts the service.
  bool restart = 5;
}

message ConfigDrift {
  // state: "" (in sync) | "pending" (valid changes wait to be applied) |
  // "invalid" (the files do not load; the running config is unchanged)
  string state = 1;
  // error says why the files are invalid.
  string error = 2;
  repeated ConfigChange changes = 3;
  // diff is a unified diff of the YAML files (env files are left out: they
  // hold secrets).
  string diff = 4;
  int64 since_unix_ms = 5;
}

message Link {
  string name = 1;
  string url = 2;
}

// Ready is a service's readiness probe.
message Ready {
  // kind: "http" | "tcp" | "exec"
  string kind = 1;
  // target is the URL, address or command the probe checks.
  string target = 2;
  int64 interval_ms = 3;
  int64 timeout_ms = 4;
  int32 retries = 5;
  int64 start_period_ms = 6;
}

message Port {
  string name = 1;
  int32 port = 2;
  // auto is true when devyard allocated the port.
  bool auto = 3;
}

message ServiceSpec {
  string command = 1;
  string dir = 2;
  // restart: "never" | "on-failure" | "always"
  string restart = 3;
  // depends_on lists the services this one waits for (until ready).
  repeated string depends_on = 4;
  Ready ready = 5;
  repeated Port ports = 6;
  bool tty = 7;
  // Environment variable names only; values are never exposed.
  repeated string env_keys = 8;
  string build_command = 9;
  bool autostart = 10;
  string stop_signal = 11;
}

message Service {
  string project = 1;
  string name = 2;
  // status: "stopped" | "waiting" | "building" | "starting" | "running" |
  //         "stopping" | "backoff" | "exited" | "failed"
  string status = 3;
  // health: "" (no healthcheck or not running) | "starting" | "healthy" | "unhealthy"
  string health = 4;
  // Last failing probe output while unhealthy.
  string health_detail = 5;
  int32 pid = 6;
  int32 exit_code = 7;
  int32 restarts = 8;
  // run is the 1-based run counter of the service; each launch is a new run
  // with its own log file.
  int64 run = 9;
  int64 started_at_unix_ms = 10;
  int64 finished_at_unix_ms = 11;
  // Human-readable reason for the current state (e.g. "waiting for db
  // (service_healthy)", "build failed", "restarting in 4s").
  string message = 12;
  repeated string urls = 13;
  ServiceSpec spec = 14;
  int64 next_restart_at_unix_ms = 15;
  // Position in the project's dependency (start) order, for display.
  int32 order = 16;
}

message TaskSpec {
  string command = 1;
  string dir = 2;
  bool tty = 3;
  repeated string depends_on = 4;
  repeated string env_keys = 5;
}

message Task {
  string project = 1;
  string name = 2;
  // status: "idle" | "waiting" | "running" | "stopping" | "exited" | "failed"
  string status = 3;
  int32 pid = 4;
  int32 exit_code = 5;
  int64 run = 6;
  int64 started_at_unix_ms = 7;
  int64 finished_at_unix_ms = 8;
  string message = 9;
  repeated string args = 10;
  TaskSpec spec = 11;
}

message GitStatus {
  string project = 1;
  bool is_repo = 2;
  string branch = 3;
  string upstream = 4;
  int32 ahead = 5;
  int32 behind = 6;
  int32 staged = 7;
  int32 dirty = 8;
  int32 untracked = 9;
  int32 conflicts = 10;
  bool is_clean = 11;
  string head_hash = 12;
  // Remote operation in progress: "" | "pull" | "fetch" | "push"
  string sync_operation = 13;
  // Incremented whenever the repository changes on disk, so clients can
  // invalidate cached logs and diffs.
  int64 change_seq = 14;
}

message EntityRef {
  // kind: "project" | "service" | "task" | "git"
  string kind = 1;
  string project = 2;
  string name = 3;
}

// -----------------------------------------------------------------------------
// Watch
// -----------------------------------------------------------------------------

message Snapshot {
  DaemonInfo daemon = 1;
  repeated Project projects = 2;
  repeated Service services = 3;
  repeated Task tasks = 4;
  repeated GitStatus git = 5;
}

message Change {
  oneof change {
    Project project = 1;
    Service service = 2;
    Task task = 3;
    GitStatus git = 4;
    EntityRef removed = 5;
    DaemonInfo daemon = 6;
  }
}

message WatchRequest {}

message WatchResponse {
  // revision is monotonically increasing per daemon process. A snapshot
  // replaces all client state; changes apply on top of the latest snapshot.
  uint64 revision = 1;
  oneof event {
    Snapshot snapshot = 2;
    Change change = 3;
    // Sent periodically so clients can detect dead connections.
    Heartbeat heartbeat = 4;
  }
}

message Heartbeat {}

message GetStateRequest {}

message GetStateResponse {
  uint64 revision = 1;
  Snapshot snapshot = 2;
}

// -----------------------------------------------------------------------------
// Daemon
// -----------------------------------------------------------------------------

message GetDaemonRequest {}

message GetDaemonResponse {
  DaemonInfo info = 1;
}

message StopDaemonRequest {}

message StopDaemonResponse {}

message RestartDaemonRequest {
  // When false (the default) services keep running and are re-adopted by
  // the replacement daemon.
  bool restart_services = 1;
}

message RestartDaemonResponse {}

message GlobalWebConfig {
  string host = 1;
  int32 port = 2;
  repeated string allowed_hosts = 3;
  // Read-only: whether a dashboard password is configured. The hash itself
  // is never exposed; SetWebPassword manages it.
  bool password_set = 4;
}

message GlobalProxyTLSConfig {
  bool enabled = 1;
  int32 port = 2;
  string cert_file = 3;
  string key_file = 4;
  bool http_redirect = 5;
}

message GlobalProxyConfig {
  string host = 1;
  int32 port = 2;
  string domain_suffix = 3;
  GlobalProxyTLSConfig tls = 4;
}

message GlobalConfig {
  GlobalWebConfig web = 1;
  GlobalProxyConfig proxy = 2;
  // projects and groups are read-only here: UpdateGlobalConfig leaves them
  // alone (projects change through AddProject, RemoveProject and
  // MoveProject; groups are edited in the config file).
  repeated string projects = 3;
  repeated ProjectGroup groups = 4;
  // reload is the default policy for config changes of a project: "prompt",
  // "auto" or "off". Per-project overrides are set in the config file.
  string reload = 5;
}

message ProjectGroup {
  string name = 1;
  // members are project ids.
  repeated string members = 2;
}

message GetGlobalConfigRequest {}

message GetGlobalConfigResponse {
  GlobalConfig config = 1;
  string path = 2;
}

message UpdateGlobalConfigRequest {
  GlobalConfig config = 1;
}

message UpdateGlobalConfigResponse {}

message SetWebPasswordRequest {
  // The new dashboard password. Hashed (bcrypt) server-side; the plaintext
  // is never stored. Ignored when clear is true.
  string password = 1;
  // Remove the password: the dashboard becomes open again.
  bool clear = 2;
}

message SetWebPasswordResponse {}

// -----------------------------------------------------------------------------
// Projects
// -----------------------------------------------------------------------------

message AddProjectRequest {
  // path is a project directory (with or without a devyard.yml) or the path
  // of a config file. The project is appended to the global config's
  // `projects` list.
  string path = 1;
  // Launch environment ("KEY=VALUE") captured from the caller's shell.
  // Empty means "use the daemon's environment".
  repeated string env = 2;
  bool start = 3;
  bool build = 4;
}

message AddProjectResponse {
  Project project = 1;
}

message StartProjectRequest {
  string project = 1;
  // Services to start (plus their depends_on chain). Empty starts all.
  repeated string services = 2;
  bool build = 3;
}

message StartProjectResponse {}

message StopProjectRequest {
  string project = 1;
}

message StopProjectResponse {}

message RestartProjectRequest {
  string project = 1;
  // Run build steps before starting again.
  bool build = 2;
}

message RestartProjectResponse {}

message ReloadProjectRequest {
  string project = 1;
  // When set, replaces the project's stored launch environment.
  repeated string env = 2;
  bool update_env = 3;
}

message ReloadProjectResponse {}

message RemoveProjectRequest {
  string project = 1;
}

// RemoveProject stops the project, deletes its state and logs and removes it
// from the global config's `projects` list.
message RemoveProjectResponse {}

message MoveProjectRequest {
  string project = 1;
  // index is the new 0-based position in the project list (clamped).
  int32 index = 2;
}

message MoveProjectResponse {}

message SuggestProjectPathsRequest {
  // prefix is a partial directory path ("~/dev/gi"); empty returns only the
  // recently removed projects.
  string prefix = 1;
}

message PathSuggestion {
  // path is an absolute directory.
  string path = 1;
  bool has_config = 2;
  bool is_git = 3;
  // listed is true when the directory is already a project.
  bool listed = 4;
}

message SuggestProjectPathsResponse {
  // recent lists removed projects that still exist, newest first.
  repeated PathSuggestion recent = 1;
  // completions lists directories matching the prefix.
  repeated PathSuggestion completions = 2;
}

// -----------------------------------------------------------------------------
// Services
// -----------------------------------------------------------------------------

message StartServiceRequest {
  string project = 1;
  string service = 2;
  bool build = 3;
}

message StartServiceResponse {}

message StopServiceRequest {
  string project = 1;
  string service = 2;
}

message StopServiceResponse {}

message RestartServiceRequest {
  string project = 1;
  string service = 2;
  bool build = 3;
}

message RestartServiceResponse {}

message KillServiceRequest {
  string project = 1;
  string service = 2;
  // Signal name (e.g. "SIGKILL", "SIGTERM", "SIGHUP"). Defaults to SIGKILL.
  string signal = 3;
}

message KillServiceResponse {}

// -----------------------------------------------------------------------------
// Tasks
// -----------------------------------------------------------------------------

message RunTaskRequest {
  string project = 1;
  string task = 2;
  repeated string args = 3;
}

message RunTaskResponse {
  int64 run = 1;
}

message StopTaskRequest {
  string project = 1;
  string task = 2;
}

message StopTaskResponse {}

message KillTaskRequest {
  string project = 1;
  string task = 2;
  string signal = 3;
}

message KillTaskResponse {}

// -----------------------------------------------------------------------------
// Logs
// -----------------------------------------------------------------------------

message LogSource {
  // kind: "service" | "task"
  string kind = 1;
  string name = 2;
}

message LogsRequest {
  string project = 1;
  // Sources to read. Empty means every service of the project (merged by
  // timestamp).
  repeated LogSource sources = 2;
  // Which run to read: 0 = current (latest) run, -1 = the run before it, and
  // so on. Following is only supported for the current run.
  int64 run_offset = 3;
  // Number of history lines to send before following (0 = all history of
  // the run, bounded server-side).
  int32 tail = 4;
  // Page backwards: send up to `tail` lines with seq < before_seq of the
  // single requested source's run. Implies follow = false.
  uint64 before_seq = 5;
  bool follow = 6;
  // Absolute run number to read (overrides run_offset when > 0). Stable
  // while the process restarts; following requires the latest run.
  int64 run = 7;
}

message LogLine {
  LogSource source = 1;
  int64 run = 2;
  uint64 seq = 3;
  int64 ts_unix_nanos = 4;
  // stream: "stdout" | "stderr" | "system"
  string stream = 5;
  string text = 6;
}

message LogsResponse {
  repeated LogLine lines = 1;
  // Set on the first response: true when history before the first returned
  // line exists (for paging).
  bool has_more_before = 2;
  // Set when the stream switched to a new run of a followed source.
  repeated LogSource new_run = 3;
}

// -----------------------------------------------------------------------------
// Attach (interactive sessions)
// -----------------------------------------------------------------------------

message AttachTarget {
  // kind: "terminal" (a new or existing project shell) | "task" | "service"
  string kind = 1;
  string project = 2;
  // Task/service name. Empty for terminals.
  string name = 3;
  // Existing terminal session id to reattach to. Empty creates a terminal.
  string session_id = 4;
}

message AttachRequest {
  oneof msg {
    AttachOpen open = 1;
    bytes input = 2;
    AttachResize resize = 3;
    // Close the process's stdin (EOF) for non-TTY sessions.
    bool close_stdin = 4;
    // End a terminal session (kills the shell). Other kinds just detach
    // when the stream ends.
    bool close = 5;
  }
}

message AttachOpen {
  AttachTarget target = 1;
  int32 cols = 2;
  int32 rows = 3;
}

message AttachResize {
  int32 cols = 1;
  int32 rows = 2;
}

message AttachResponse {
  oneof msg {
    AttachReady ready = 1;
    bytes output = 2;
    AttachExit exit = 3;
  }
}

message AttachReady {
  string session_id = 1;
  // True when the target is a TTY (raw keystrokes); false for line-based
  // stdin (non-TTY tasks/services).
  bool tty = 2;
}

message AttachExit {
  int32 exit_code = 1;
  string message = 2;
}

// -----------------------------------------------------------------------------
// Stats & ports
// -----------------------------------------------------------------------------

message StatsRequest {
  string project = 1;
  int64 interval_ms = 2;
}

message ProcessStat {
  // kind: "service" | "task"
  string kind = 1;
  string name = 2;
  int32 pid = 3;
  int32 procs = 4;
  double cpu_percent = 5;
  uint64 rss_bytes = 6;
}

message StatsResponse {
  int64 ts_unix_ms = 1;
  repeated ProcessStat stats = 2;
}

message PortBinding {
  string project = 1;
  string service = 2;
  int32 pid = 3;
  string ip = 4;
  int32 port = 5;
  string protocol = 6;
}

message ListPortsRequest {
  string project = 1;
}

message ListPortsResponse {
  repeated PortBinding ports = 1;
}

// -----------------------------------------------------------------------------
// Git
// -----------------------------------------------------------------------------

message GitRef {
  string name = 1;
  string type = 2;
  bool is_active = 3;
}

message GitBranch {
  string name = 1;
  string hash = 2;
  bool is_active = 3;
  bool is_remote = 4;
  string upstream = 5;
  int32 ahead = 6;
  int32 behind = 7;
}

message GitTag {
  string name = 1;
  string hash = 2;
}

message GitStash {
  string index = 1;
  string name = 2;
  string hash = 3;
  int64 time_unix_ms = 4;
}

message GitCommit {
  string hash = 1;
  string short = 2;
  string author = 3;
  string email = 4;
  int64 time_unix_ms = 5;
  repeated string parents = 6;
  string subject = 7;
  bool head = 8;
  repeated GitRef refs = 9;
  int32 additions = 10;
  int32 deletions = 11;
  int32 files_changed = 12;
  // The message body below the subject; filled by GitDiff, empty in GitLog.
  string body = 13;
}

message GitFileChange {
  string path = 1;
  string old_path = 2;
  string status = 3;
  int32 additions = 4;
  int32 deletions = 5;
  bool staged = 6;
  bool unstaged = 7;
  bool untracked = 8;
}

message GitDiffResult {
  GitCommit commit = 1;
  repeated GitFileChange files = 2;
  string diff = 3;
}

message GitLogRequest {
  string project = 1;
  // Newest commits to skip (paging); 0 is the first page.
  int32 skip = 2;
  // Only commits that touched this path (repository-relative); empty = all.
  string path = 3;
}

message GitLogResponse {
  repeated GitCommit commits = 1;
  repeated GitBranch branches = 2;
  repeated GitTag tags = 3;
  repeated GitStash stashes = 4;
  // Whether commits older than this page exist.
  bool has_more = 5;
}

message GitDiffRequest {
  string project = 1;
  // Commit hash, or "WORKDIR" for uncommitted changes.
  string hash = 2;
  string path = 3;
  int32 context_lines = 4;
  // Compare this ref (a branch, tag or hash) to `hash` (base..hash) instead
  // of showing `hash` against its parent.
  string base = 5;
}

message GitDiffResponse {
  GitDiffResult result = 1;
}

message GitStageRequest {
  string project = 1;
  string path = 2;
  bool stage_all = 3;
  bool unstage = 4;
}

message GitStageResponse {}

message GitStashRequest {
  string project = 1;
  // op: "push" (stash the working tree), "apply" (restore a stash and keep
  // it), "pop" (restore a stash and remove it) or "drop" (remove a stash).
  string op = 2;
  // push: stash only these paths (empty = all changes).
  repeated string paths = 3;
  // push: stash message (default "WIP on <branch>").
  string message = 4;
  // push: also stash untracked files. Ignored files are never stashed.
  bool include_untracked = 5;
  // pop/apply/drop: which stash to use ("stash@{n}"); empty = the newest.
  string index = 6;
}

message GitStashResponse {}

message GitCommitRequest {
  string project = 1;
  string message = 2;
  // Amend HEAD instead of creating a commit: staged changes are folded into
  // HEAD and message replaces its message. An empty message keeps HEAD's
  // message.
  bool amend = 3;
}

message GitCommitResponse {}

message GitPushRequest {
  string project = 1;
}

message GitPushResponse {
  string output = 1;
}

message GitPullRequest {
  string project = 1;
}

message GitPullResponse {
  string output = 1;
}

message GitFetchRequest {
  string project = 1;
}

message GitFetchResponse {
  string output = 1;
}

message GitCheckoutRequest {
  string project = 1;
  // A local branch name, or a remote branch ("origin/feature") whose local
  // counterpart is created tracking it. Uncommitted changes keep git from
  // switching when they would be overwritten.
  string branch = 2;
}

message GitCheckoutResponse {}

message GitBranchCreateRequest {
  string project = 1;
  string name = 2;
  // A branch name or commit hash to start from (empty = HEAD).
  string start = 3;
  // Check the new branch out immediately.
  bool checkout = 4;
}

message GitBranchCreateResponse {}

message GitBranchDeleteRequest {
  string project = 1;
  string name = 2;
  // Delete even when the branch is not merged (git branch -D).
  bool force = 3;
}

message GitBranchDeleteResponse {}

message GitTagCreateRequest {
  string project = 1;
  string name = 2;
  // A commit hash or ref to tag (empty = HEAD).
  string target = 3;
  // Annotated tag message (empty = a lightweight tag).
  string message = 4;
}

message GitTagCreateResponse {}

message GitTagDeleteRequest {
  string project = 1;
  string name = 2;
}

message GitTagDeleteResponse {}

message GitRestoreRequest {
  string project = 1;
  // Restore this path to its committed state: staged and unstaged changes
  // are discarded and untracked files deleted (ignored files are kept).
  // Paths are repository-relative, as in GitDiff.
  string path = 2;
  // Restore every path of the project's directory.
  bool all = 3;
}

message GitRestoreResponse {}

// GitApply applies a unified diff — typically one hunk of one file — to the
// index (cached) or the working tree, optionally in reverse. It is how the
// dashboard stages, unstages or discards individual hunks.
message GitApplyRequest {
  string project = 1;
  string patch = 2;
  bool cached = 3;
  bool reverse = 4;
}

message GitApplyResponse {}
