# Smoke-test config for devyard.
#
# Uses only POSIX tools (sh, printf, test, tail, sleep) so it runs on macOS and
# Linux without any external dependencies. Exercises: env, dir,
# depends_on, ready probes, and restart policies.
#
# Run from this directory:
#
#   devyard start -f    # foreground, Ctrl-C to stop
#   devyard start       # detached
#   devyard status      # status
#   devyard logs -f
#   devyard restart worker
#   devyard stop
#
# Expected behavior:
#   - api starts, writes ./api.ready, then idles forever; ready probe flips to
#     healthy once the marker file exists.
#   - worker waits for api to be ready, prints 5 ticks, then exits 0.
#   - crasher depends on api, exits 7, and is restarted by the
#     on-failure policy until the backoff cap is hit.
#
# Note: `stop` records that the project should stay stopped, so the daemon
# won't start it again on its next start; the next explicit `start` resumes it.
# Killing the daemon (even with SIGKILL) never stops services: the next daemon
# re-adopts them.

name: smoke

services:
  api:
    run: |
      printf 'api: starting (port %s)\n' "$PORT"
      touch "$READY_FILE"
      printf 'api: ready file written, idling\n'
      tail -f /dev/null
    env:
      PORT: "8090"
      READY_FILE: "./api.ready"
    ready:
      exec: test -f "$READY_FILE"
      interval: 1s
      timeout: 1s
      retries: 5
    restart: always

  worker:
    run: |
      printf 'worker: api is healthy, starting work\n'
      i=0
      while [ "$i" -lt 5 ]; do
        printf 'worker: tick %d\n' "$i"
        sleep 1
        i=$((i + 1))
      done
      printf 'worker: done\n'
    depends_on: [api]

  crasher:
    run: |
      printf 'crasher: about to exit non-zero\n'
      exit 7
    depends_on: [api]
    restart: on-failure
