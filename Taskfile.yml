# https://taskfile.dev
#
# Same workflow as the root devyard.yml (preferred):
#   devyard start -f

version: "3"

tasks:
  default:
    desc: Start the Vite frontend for local development (needs a running daemon)
    deps:
      - frontend

  frontend:
    desc: Start the Vite frontend (bun)
    dir: web
    cmds:
      - bun run dev
