name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: bun run typecheck
      - name: Unit tests
        working-directory: web
        run: bun run test
      - name: Build
        working-directory: web
        run: bun run build

  test:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # devyard is macOS + Linux only (process groups, PTYs, signals,
        # Unix sockets). No Windows.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web SPA (embedded into the binary)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat the following files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: Unit tests
        run: go test -race ./internal/... ./cmd/...

      - name: E2E tests (hermetic sandbox)
        run: go test -race -timeout 30m ./test/e2e/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout 5m
