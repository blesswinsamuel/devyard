# Smoke-test config for local-compose.
#
# Uses only POSIX tools (sh, printf, test, tail, sleep) so it runs on macOS and
# Linux without any external dependencies. Exercises: env, working_dir,
# depends_on (list + map with service_healthy), healthcheck, and restart
# policies.
#
# Run from this directory:
#
#   local-compose up          # foreground, Ctrl-C to stop
#   local-compose up -d       # detached
#   local-compose ps          # status
#   local-compose logs --follow
#   local-compose restart worker
#   local-compose down
#
# Expected behavior:
#   - api starts, writes ./api.ready, then idles forever; healthcheck flips to
#     healthy once the marker file exists.
#   - worker waits for api to be healthy, prints 5 ticks, then exits 0.
#   - crasher depends on api (service_started), exits 7, and is restarted by the
#     on-failure policy until the backoff cap is hit.
#
# Note: api uses `restart: always` (not `unless-stopped`) deliberately. With
# `unless-stopped`, the first Ctrl-C / `down` writes an "api.stopped" marker in
# the XDG state dir, and every subsequent `up` SKIPS api — so worker/crasher
# fail with "dependency api exited before satisfying ...". That marker is only
# cleared by `restart api`, which makes the smoke test annoying to re-run.
# `always` never writes the marker, so this config is re-runnable.

version: "1"
name: smoke

services:
  api:
    command: |
      printf 'api: starting (port %s)\n' "$PORT"
      touch "$READY_FILE"
      printf 'api: ready file written, idling\n'
      tail -f /dev/null
    working_dir: .
    env:
      PORT: "8090"
      READY_FILE: "./api.ready"
    healthcheck:
      test: ["CMD-SHELL", "test -f \"$READY_FILE\""]
      interval: 1s
      timeout: 1s
      retries: 5
    restart: always

  worker:
    command: |
      printf 'worker: api is healthy, starting work\n'
      i=0
      while [ "$i" -lt 5 ]; do
        printf 'worker: tick %d\n' "$i"
        sleep 1
        i=$((i + 1))
      done
      printf 'worker: done\n'
    working_dir: .
    depends_on:
      api: { condition: service_healthy }

  crasher:
    command: |
      printf 'crasher: about to exit non-zero\n'
      exit 7
    working_dir: .
    depends_on: [api]
    restart: on-failure
