# yaml-language-server: $schema=internal/config/devyard.schema.json
# Local development for the web UI: Vite (SolidJS) frontend with running daemon.
#
# Prerequisites:
#   - Go toolchain
#   - bun (see web/bun.lock)
#   - A running devyard daemon (started automatically by `start` or `up`)
#
# Usage (from repo root):
#
#   devyard start -f    # foreground; Ctrl-C stops
#   devyard start       # detached
#   devyard logs -f
#   devyard stop
#
# Then open the Vite app at http://127.0.0.1:19095 (proxies /ws and RPC
# to the daemon on :9090).

name: devyard
primary: frontend

services:
  frontend:
    run: bun run dev
    dir: ./web
    port: 19095
    build:
      run: bun install
      sources: [web/package.json, web/bun.lock]
    restart: always

tasks:
  install-daemon: task install
  restart-daemon: bash -c 'devyard daemon restart >/dev/null 2>&1 &'
